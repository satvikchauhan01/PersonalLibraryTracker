# Phase 16: serves the CRA build as a single-page app — any path nginx
# can't find as a static file (i.e. every client-side react-router route,
# like /reset-password/:token) falls back to index.html instead of a raw
# nginx 404, letting react-router take over and render the right page.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets can be cached aggressively — CRA fingerprints filenames
    # (main.<hash>.js), so a new build is always a new URL, never a stale cache hit.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
